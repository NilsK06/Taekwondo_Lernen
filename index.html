<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Lernquiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./images/1_1751383456.png" type="icon">
</head>

<body>
  <div class="container">
    <div class="title">
      <img src="./images/itf-logo-back-database.png" alt="ITF Logo" class="logo">
      <h1>Lernquiz</h1>
    </div>

    <!-- Startscreen -->
    <div id="startScreen">
      <label for="username">Benutzername:</label>
      <input type="text" id="username" placeholder="z. B. Max" />
      <button id="loadBtn" class="inlineBtn" title="Vorhandenen Nutzer laden" onclick="loadExistingUser()">Laden</button>
      <br><br>

      <p>Dein Level: <span id="userLevel">–</span></p>
      <div id="levelBarContainer">
        <progress id="levelBar" value="0" max="100"></progress>
        <small id="xpHint">(0 / 100 XP bis zum nächsten Level)</small>
      </div>

      <label for="difficulty">Schwierigkeitsgrad:</label>
      <select id="difficulty">
        <option value="easy">Einfach</option>
        <option value="medium" disabled>Mittel (ab Level 2)</option>
        <option value="hard" disabled>Schwer (ab Level 4)</option>
        <option value="extreme" disabled>Sehr Schwer (ab Level 6)</option>
      </select>
      <br><br>

      <div class="row">
        <button onclick="startQuiz()">Starten</button>
        <button class="secondary" onclick="resetProgress()">Fortschritt zurücksetzen</button>
      </div>
      <p class="muted" id="lastUserInfo"></p>
    </div>

    <!-- Quizscreen -->
    <div id="quizScreen" class="hidden">
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="questionContainer"></div>
      <div class="row">
        <button class="secondary" onclick="cancelQuiz()">Abbrechen</button>
      </div>
    </div>

    <!-- Endscreen -->
    <div id="endScreen" class="hidden">
      <h2>Fertig!</h2>
      <p id="resultText"></p>
      <div class="row">
        <button onclick="startQuiz()">Nochmal spielen</button>
        <button class="backBtn secondary" onclick="backToMenu()">Zurück zum Menü</button>
      </div>
    </div>

    <script src="script.js"></script>
  </div>
</body>

</html>
