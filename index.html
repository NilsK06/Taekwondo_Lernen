<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lernquiz</title>
  <link rel="icon" href="./images/1_1751383456.png" type="icon">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="container">

    <div class="title">
      <img src="./images/itf-logo-back-database.png" class="logo">
      <h1>Lernquiz</h1>
    </div>

    <!-- Kategorie Screen -->
    <div id="categoryScreen">
      <div class="categoryGrid">
        <div class="categoryCard" onclick="selectCategory('grundlagen')">
          <span class="categoryIcon">🥋</span>
          <strong>Grundlagen</strong>
          <small>Basics & Begriffe</small>
        </div>

        <div class="categoryCard" onclick="selectCategory('theorie')">
          <span class="categoryIcon">📘</span>
          <strong>Theorie</strong>
          <small>Wissen & Regeln</small>
        </div>

        <div class="categoryCard" onclick="selectCategory('technik')">
          <span class="categoryIcon">👊</span>
          <strong>Techniken</strong>
          <small>Schläge & Tritte</small>
        </div>

        <div class="categoryCard" onclick="selectCategory('pruefung')">
          <span class="categoryIcon">🏆</span>
          <strong>Prüfung</strong>
          <small>Vorbereitung</small>
        </div>

        <!-- Neuer Lernbereich: öffnet das Nachschlagewerk -->
        <a class="categoryCard" href="lernen.html"
           style="grid-column: 1 / -1; min-height: 110px; text-decoration: none;"
           aria-label="Lernbereich öffnen – Begriffe, Techniken und Theorie nachlesen">
          <span class="categoryIcon">📚</span>
          <strong>Lernbereich</strong>
          <small>Begriffe, Techniken und Theorie nachlesen</small>
        </a>
      </div>
    </div>

    <!-- Startscreen -->
    <div id="startScreen" class="hidden">

      <div class="row">
        <label>Benutzername:</label>
        <input type="text" id="username">
        <button class="inlineBtn" onclick="loadExistingUser()">Laden</button>
      </div>

      <p class="lvl">Dein Level: <span id="userLevel">–</span></p>

      <progress id="levelBar" value="0" max="100"></progress>
      <p id="xpHint">(0 / 100 XP bis zum nächsten Level)</p>

      <div class="row">
        <label>Schwierigkeit:</label>
        <select id="difficulty">
          <option value="k10">10 Kup</option>
          <option value="k9">9 Kup</option>
          <option value="k8">8 Kup</option>
          <option value="k7">7 Kup</option>
          <option value="k6">6 Kup</option>
          <option value="k5">5 Kup</option>
          <option value="k4">4 Kup</option>
          <option value="k3">3 Kup</option>
          <option value="k2">2 Kup</option>
          <option value="k1">1 Kup</option>
          <option value="D1">ab 1 Dan</option>
        </select>
      </div>

      <div class="row">
        <button onclick="startQuiz()" class="start">Starten</button>
        <button class="secondary" onclick="resetProgress()">Reset</button>
        <button class="secondary" onclick="backToCategories()">Kategorie</button>
      </div>

    </div>

    <!-- Quiz -->
    <div id="quizScreen" class="hidden">
      <progress id="progressBar" value="0" max="100"></progress>

      <div id="questionContainer"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="row">
        <button class="secondary" onclick="cancelQuiz()">Abbrechen</button>
        <button id="checkBtn" class="hidden" onclick="checkInteractiveAnswer()">Antwort prüfen</button>
        <button id="nextBtn" class="hidden" onclick="nextQuestion()">Weiter</button>
      </div>
    </div>

    <!-- Ende -->
    <div id="endScreen" class="hidden">
      <h2>Fertig!</h2>
      <p id="resultText"></p>

      <div class="row">
        <button onclick="startQuiz()">Nochmal</button>
        <button class="secondary" onclick="backToMenu()">Menü</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
